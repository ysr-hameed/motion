<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SlyxUp Motion — describe the clip, get a cut. AI-composed motion graphics with instant preview." />
    <meta name="theme-color" content="#5b50e6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>SlyxUp Motion — AI motion studio</title>
    <script>
      try {
        const t = localStorage.getItem("vite-ui-theme") || "system";
        if (
          t === "dark" ||
          (t === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
